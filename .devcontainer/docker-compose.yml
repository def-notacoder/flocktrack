services:
  workspace:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    command: sleep infinity
    working_dir: /workspaces/flocktrack
    volumes:
      - ..:/workspaces/flocktrack:cached
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://flocktrack:flocktrack@postgres:5432/flocktrack?schema=public
      PORT: 3001
    ports:
      - "5173:5173"
      - "3001:3001"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flocktrack
      POSTGRES_PASSWORD: flocktrack
      POSTGRES_DB: flocktrack
    ports:
      - "5432:5432"
    volumes:
      - flocktrack_pg_devcontainer:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flocktrack -d flocktrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flocktrack_pg_devcontainer:
