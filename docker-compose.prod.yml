services:
  postgres:
    image: postgres:16-alpine
    container_name: flocktrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flocktrack
      POSTGRES_PASSWORD: flocktrack
      POSTGRES_DB: flocktrack
    ports:
      - "5432:5432"
    volumes:
      - flocktrack_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flocktrack -d flocktrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: flocktrack-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://flocktrack:flocktrack@postgres:5432/flocktrack?schema=public
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - flocktrack_uploads:/app/server/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  flocktrack_pg:
  flocktrack_uploads:
