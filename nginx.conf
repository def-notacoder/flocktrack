server {
    server_name flocklog.merlinandthegang.ca;

    listen 80;
    listen 443 ssl http2;

    ssl_certificate /letsencrypt/live/ryan-ewen.com/fullchain.pem;
    ssl_certificate_key /letsencrypt/live/ryan-ewen.com/privkey.pem;

    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }

    # Match API JSON body limit (base64-encoded phone photos).
    client_max_body_size 24m;

    resolver 127.0.0.11 valid=30s;

    proxy_buffering off;

    location / {
        set $upstream flocklog:3001;
        proxy_pass http://$upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
